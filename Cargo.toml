[workspace]
resolver = "3"
members = ["crates/common", "crates/meter", "crates/gateway", "crates/mandate", "crates/agent"]

[workspace.dependencies]
common = { path = "crates/common" }
meter = { path = "crates/meter" }
mandate = { path = "crates/mandate" }
agent = { path = "crates/agent" }

# x402 protocol, Hedera exact scheme, HTTP transport
r402-protocol = "0.21"
r402-server = "0.21"
r402-client = "0.21"
r402-facilitator = { version = "0.21", features = ["http-client"] }
r402-http = { version = "0.21", features = ["client", "server"] }
r402-hedera = { version = "0.21", features = ["client", "server"] }

# Hedera consensus service (receipt audit trail) + scheduled transactions
hedera = "0.43"

# ENSv2 Sepolia reads for the mandate tree
alloy = { version = "2", features = ["full"] }

anyhow = "1"
axum = "0.8"
base64 = "0.23"
dotenvy = "0.15"
reqwest = { version = "0.13", features = ["json"] }
reqwest-middleware = { version = "0.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
